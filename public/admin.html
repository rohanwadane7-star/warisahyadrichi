<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | वारी सह्याद्रीची</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1ea;color:#24352a}.wrap{max-width:1250px;margin:auto;padding:30px 18px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:20px}h1,h2,h3{margin-top:0}.login{max-width:420px;margin:70px auto}.input{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px;border-radius:14px;background:#f8f6f1}.stat b{font-size:28px;display:block;margin-top:5px}.muted{color:#667}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;background:#d8782d;color:white;font-weight:700}.danger{background:#9d3b32}.secondary{background:#355d45}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;vertical-align:top}th{background:#f8f6f1}.status{padding:7px;border-radius:6px;border:1px solid #ddd}.trek-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.trek-card{border:1px solid #eee;border-radius:12px;padding:16px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form-grid input,.form-grid select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px}.form-grid label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}.notice{padding:10px;border-radius:8px;background:#fff8e9;margin:10px 0}.error{color:#a33}.success{color:#27633b}@media(max-width:900px){.grid,.trek-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.trek-grid,.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const app=document.getElementById('app');
function login(){app.innerHTML=`<div class="card login"><h1>वारी सह्याद्रीची</h1><p class="muted">Admin Login</p><input class="input" id="u" placeholder="Username" value="admin"><input class="input" id="p" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button><p id="err" class="error"></p></div>`}
async function doLogin(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(!r.ok){err.textContent=d.error;return}sessionStorage.setItem('adminToken',d.token);load()}
function headers(){return {'Authorization':'Bearer '+sessionStorage.getItem('adminToken'),'Content-Type':'application/json'}}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('adminToken');login();throw new Error('Session expired')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function load(){try{const [bookings,tr] = await Promise.all([api('/api/admin/bookings'),fetch('/api/treks').then(r=>r.json())]);render(bookings,tr)}catch(e){if(e.message!=='Session expired')app.innerHTML=`<div class="card"><p class="error">${esc(e.message)}</p><button class="btn" onclick="load()">Retry</button></div>`}}
function render(bookings,tr){
 const pending=bookings.filter(b=>b.status==='Pending').length, confirmed=bookings.filter(b=>b.status==='Confirmed').length, cancelled=bookings.filter(b=>b.status==='Cancelled').length;
 app.innerHTML=`<div class="top"><div><h1>वारी सह्याद्रीची — Admin Dashboard</h1><p class="muted">Manage bookings, trek prices, capacity and status.</p></div><div class="actions"><button class="btn secondary" onclick="showAddTrek()">+ Add Trek</button><button class="btn danger" onclick="logout()">Logout</button></div></div>
 <div class="grid"><div class="stat">Total Bookings<b>${bookings.length}</b></div><div class="stat">Pending<b>${pending}</b></div><div class="stat">Confirmed<b>${confirmed}</b></div><div class="stat">Cancelled<b>${cancelled}</b></div></div>
 <div class="card"><h2>Bookings</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Trek</th><th>Date</th><th>People</th><th>Pickup</th><th>Status</th></tr></thead><tbody>${bookings.map(b=>`<tr><td>${esc(b.id)}<br><small>${esc(new Date(b.createdAt).toLocaleString())}</small></td><td><b>${esc(b.name)}</b><br>${esc(b.mobile)}<br>${esc(b.email||'')}</td><td>${esc(b.trek)}</td><td>${esc(b.date)}</td><td>${esc(b.participants)}</td><td>${esc(b.pickup)}</td><td><select class="status" onchange="statusUpdate('${esc(b.id)}',this.value)"><option ${b.status==='Pending'?'selected':''}>Pending</option><option ${b.status==='Confirmed'?'selected':''}>Confirmed</option><option ${b.status==='Cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join('')||'<tr><td colspan="7">No bookings yet.</td></tr>'}</tbody></table></div></div>
 <div class="card"><div class="top"><div><h2>Treks & Capacity</h2><p class="muted">Change price, seats and trek status without editing code.</p></div></div><div class="trek-grid">${tr.map(t=>`<div class="trek-card"><h3>${esc(t.name)}</h3><p>₹${Number(t.price)||0} · ${esc(t.status)}</p><p>Capacity: <b>${Number(t.totalSeats)||0}</b> seats</p><small>${esc(t.route||'')} · ${esc(t.difficulty||'')} · ${esc(t.duration||'')}</small><br><br><button class="btn" onclick='editTrek(${JSON.stringify(t)})'>Edit</button> <button class="btn danger" onclick="deleteTrek('${esc(t.id)}')">Delete</button></div>`).join('')}</div></div>`;
}
function showAddTrek(){app.insertAdjacentHTML('afterbegin',`<div class="card" id="trekEditor"><h2>Add New Trek</h2><div class="form-grid"><div><label>ID</label><input id="tid" placeholder="e.g. kaspathar"></div><div><label>Name</label><input id="tname" placeholder="Trek name"></div><div><label>Price (₹)</label><input id="tprice" type="number" min="0" value="1399"></div><div><label>Total Seats</label><input id="tseats" type="number" min="0" value="25"></div><div><label>Status</label><select id="tstatus"><option value="active">Active</option><option value="coming-soon">Coming Soon</option></select></div><div><label>Route</label><input id="troute" placeholder="Pune → Trek"></div><div><label>Difficulty</label><input id="tdiff" placeholder="Moderate"></div><div><label>Duration</label><input id="tduration" placeholder="1 Day"></div><div><label>Short Info</label><input id="tsubtitle" placeholder="Short trek line"></div><div><label>Description</label><input id="tdescription" placeholder="Trek description"></div><div><label>Image</label><input id="timage" placeholder="images/sahyadri-01.jpeg"></div></div><br><div class="actions"><button class="btn" onclick="createTrek()">Save Trek</button><button class="btn danger" onclick="document.getElementById('trekEditor').remove()">Cancel</button></div><p id="editorMsg"></p></div>`)}
function editTrek(t){app.insertAdjacentHTML('afterbegin',`<div class="card" id="trekEditor"><h2>Edit ${esc(t.name)}</h2><div class="form-grid"><div><label>Name</label><input id="tname" value="${esc(t.name)}"></div><div><label>Price (₹)</label><input id="tprice" type="number" min="0" value="${Number(t.price)||0}"></div><div><label>Total Seats</label><input id="tseats" type="number" min="0" value="${Number(t.totalSeats)||0}"></div><div><label>Status</label><select id="tstatus"><option value="active" ${t.status==='active'?'selected':''}>Active</option><option value="coming-soon" ${t.status==='coming-soon'?'selected':''}>Coming Soon</option></select></div><div><label>Route</label><input id="troute" value="${esc(t.route||'')}"></div><div><label>Difficulty</label><input id="tdiff" value="${esc(t.difficulty||'')}"></div><div><label>Duration</label><input id="tduration" value="${esc(t.duration||'')}"></div><div><label>Short Info</label><input id="tsubtitle" value="${esc(t.subtitle||'')}"></div><div><label>Description</label><input id="tdescription" value="${esc(t.description||'')}"></div><div><label>Image</label><input id="timage" value="${esc(t.image||'')}"></div></div><br><div class="actions"><button class="btn" onclick="saveTrek('${esc(t.id)}')">Update Trek</button><button class="btn danger" onclick="document.getElementById('trekEditor').remove()">Cancel</button></div><p id="editorMsg"></p></div>`)}
async function createTrek(){try{await api('/api/admin/treks',{method:'POST',body:JSON.stringify({id:tid.value.trim().toLowerCase().replace(/\s+/g,'-'),name:tname.value.trim(),price:Number(tprice.value),totalSeats:Number(tseats.value),status:tstatus.value,route:troute.value,difficulty:tdiff.value,duration:tduration.value,subtitle:tsubtitle.value,description:tdescription.value,image:timage.value})});await load()}catch(e){editorMsg.textContent=e.message;editorMsg.className='error'}}
async function saveTrek(id){try{await api('/api/admin/treks/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({name:tname.value,price:Number(tprice.value),totalSeats:Number(tseats.value),status:tstatus.value,route:troute.value,difficulty:tdiff.value,duration:tduration.value,subtitle:tsubtitle.value,description:tdescription.value,image:timage.value})});await load()}catch(e){editorMsg.textContent=e.message;editorMsg.className='error'}}
async function deleteTrek(id){if(!confirm('Delete this trek? Existing bookings will remain.'))return;try{await api('/api/admin/treks/'+encodeURIComponent(id),{method:'DELETE'});await load()}catch(e){alert(e.message)}}
async function statusUpdate(id,status){try{await api('/api/admin/bookings/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});await load()}catch(e){alert(e.message)}}
async function logout(){await fetch('/api/admin/logout',{method:'POST',headers:headers()});sessionStorage.removeItem('adminToken');login()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
sessionStorage.getItem('adminToken')?load():login();
</script>
</body></html>
